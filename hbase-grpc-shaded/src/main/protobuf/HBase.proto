syntax = "proto3";

// This file contains protocol buffers that are shared throughout HBase
package hbase.grpc;

option java_package = "org.apache.hadoop.hbase.shaded.grpc.generated";
option java_outer_classname = "HBaseProtos";
option java_generate_equals_and_hash = true;
option optimize_for = SPEED;


/**
 * Table Name
 */
message TableName {
  bytes namespace = 1;
  bytes qualifier = 2;
}

/**
 * Table Schema
 * Inspired by the rest TableSchema
 */
message TableSchema {
  TableName table_name = 1;
  repeated BytesBytesPair attributes = 2;
  repeated ColumnFamilySchema column_families = 3;
  repeated NameStringPair configuration = 4;
}

/** Denotes state of the table */
message TableState {
  // Table's current state
  enum State {
    ENABLED = 0;
    DISABLED = 1;
    DISABLING = 2;
    ENABLING = 3;
  }
  // This is the table's state.
  State state = 1;
}

/**
 * Column Family Schema
 * Inspired by the rest ColumSchemaMessage
 */
message ColumnFamilySchema {
  bytes name = 1;
  repeated BytesBytesPair attributes = 2;
  repeated NameStringPair configuration = 3;
}

/**
 * Protocol buffer version of RegionInfo.
 */
message RegionInfo {
  uint64 region_id = 1;
  TableName table_name = 2;
  bytes start_key = 3;
  bytes end_key = 4;
  bool offline = 5;
  bool split = 6;
  int32 replica_id = 7;
}

/**
 * Protocol buffer for favored nodes
 */
message FavoredNodes {
  repeated ServerName favored_node = 1;
}

/**
 * Container protocol buffer to specify a region.
 * You can specify region by region name, or the hash
 * of the region name, which is known as encoded
 * region name.
 */
message RegionSpecifier {
  enum RegionSpecifierType {
    // <tablename>,<startkey>,<regionId>.<encodedName>
    REGION_NAME = 0;

    // hash of <tablename>,<startkey>,<regionId>
    ENCODED_REGION_NAME = 1;
  }
  RegionSpecifierType type = 1;
  bytes value = 2;
}

/**
 * A range of time. Both from and to are Java time
 * stamp in milliseconds. If you don't specify a time
 * range, it means all time.  By default, if not
 * specified, from = 0, and to = Long.MAX_VALUE
 */
message TimeRange {
  uint64 from = 1;
  uint64 to = 2;
}

message TimeRangeTracker {
  uint64 from = 1;
  uint64 to = 2;
}

/* ColumnFamily Specific TimeRange */
message ColumnFamilyTimeRange {
  bytes column_family = 1;
  TimeRange time_range = 2;
}

/* Comparison operators */
enum CompareType {
  LESS = 0;
  LESS_OR_EQUAL = 1;
  EQUAL = 2;
  NOT_EQUAL = 3;
  GREATER_OR_EQUAL = 4;
  GREATER = 5;
  NO_OP = 6;
}

/**
 * Protocol buffer version of ServerName
 */
message ServerName {
  string host_name = 1;
  uint32 port = 2;
  uint64 start_code = 3;
}

// Comment data structures

message Coprocessor {
  string name = 1;
}

message NameStringPair {
  string name = 1;
  string value = 2;
}

message NameBytesPair {
  string name = 1;
  bytes value = 2;
}

message BytesBytesPair {
  bytes first = 1;
  bytes second = 2;
}

message NameInt64Pair {
  string name = 1;
  int64 value = 2;
}



/**
 * Description of the distributed procedure to take
 */
message ProcedureDescription {
  string signature = 1; // the unique signature of the procedure
  string instance = 2; // the procedure instance name
  int64 creation_time = 3;
  repeated NameStringPair configuration = 4;
}

message EmptyMsg {
}

enum TimeUnit {
  NANOSECONDS = 0;
  MICROSECONDS = 1;
  MILLISECONDS = 2;
  SECONDS = 3;
  MINUTES = 4;
  HOURS = 5;
  DAYS = 6;
}

message LongMsg {
  int64 long_msg = 1;
}

message DoubleMsg {
  double double_msg = 1;
}

message BigDecimalMsg {
  bytes bigdecimal_msg = 1;
}

message UUID {
  uint64 least_sig_bits = 1;
  uint64 most_sig_bits = 2;
}

message NamespaceDescriptor {
  bytes name = 1;
  repeated NameStringPair configuration = 2;
}

// Rpc client version info proto. Included in ConnectionHeader on connection setup
message VersionInfo {
  string version = 1;
  string url = 2;
  string revision = 3;
  string user = 4;
  string date = 5;
  string src_checksum = 6;
  uint32 version_major = 7;
  uint32 version_minor = 8;
}

/**
 * Description of the region server info
 */
message RegionServerInfo {
  int32 infoPort = 1;
  VersionInfo version_info = 2;
}

message RegionExceptionMessage {
  RegionSpecifier region = 1;
  NameBytesPair exception = 2;
}

message CacheEvictionStats {
  int64 evicted_blocks = 1;
  int64 bytes_evicted = 2;
  int64 max_cache_size = 3;
  repeated RegionExceptionMessage exception = 4;
}

message FlushedStoreSequenceId {
  bytes family = 1;
  uint64 seqId = 2;
}

message FlushedRegionSequenceId {
  bytes regionEncodedName = 1;
  uint64 seqId = 2;
  repeated FlushedStoreSequenceId stores = 3;
}

message FlushedSequenceId {
  repeated FlushedRegionSequenceId regionSequenceId = 1;
}

message RegionLocation {
  RegionInfo region_info = 1;
  ServerName server_name = 2;
  int64 seq_num = 3;
}

message LogRequest {
  string log_class_name = 1;
  bytes log_message = 2;
}

message LogEntry {
  string log_class_name = 1;
  bytes log_message = 2;
}

message RotateFileData {
  int64 timestamp = 1;
  bytes data = 2;
}
