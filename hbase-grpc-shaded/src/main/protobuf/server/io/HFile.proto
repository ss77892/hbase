syntax = "proto3";

package hbase.grpc;

option java_package = "org.apache.hadoop.hbase.shaded.grpc.generated";
option java_outer_classname = "HFileProtos";
option java_generic_services = true;
option java_generate_equals_and_hash = true;
option optimize_for = SPEED;

import "HBase.proto";

message CompactionEventTracker {
  repeated bytes compacted_store_file = 1;
}

// Map of name/values
message FileInfoProto {
  repeated BytesBytesPair map_entry = 1;
}

// HFile file trailer
message FileTrailerProto {
uint64 file_info_offset = 1;
uint64 load_on_open_data_offset = 2;
uint64 uncompressed_data_index_size = 3;
uint64 total_uncompressed_bytes = 4;
uint32 data_index_count = 5;
uint32 meta_index_count = 6;
uint64 entry_count = 7;
uint32 num_data_index_levels = 8;
uint64 first_data_block_offset = 9;
uint64 last_data_block_offset = 10;
string comparator_class_name = 11;
uint32 compression_codec = 12;
bytes encryption_key = 13;
}
