syntax = "proto3";

package hbase.grpc;

option java_package = "org.apache.hadoop.hbase.shaded.grpc.generated";
option java_outer_classname = "QuotaProtos";
option java_generic_services = true;
option java_generate_equals_and_hash = true;
option optimize_for = SPEED;

import "HBase.proto";

enum QuotaScope {
  CLUSTER = 0;
  MACHINE = 1;
}

message TimedQuota {
TimeUnit time_unit = 1;
uint64 soft_limit  = 2;
float share = 3;
QuotaScope scope  = 4;
}

enum ThrottleType {
  REQUEST_NUMBER = 0;
  REQUEST_SIZE   = 1;
  WRITE_NUMBER   = 2;
  WRITE_SIZE     = 3;
  READ_NUMBER    = 4;
  READ_SIZE      = 5;
  REQUEST_CAPACITY_UNIT = 6;
  WRITE_CAPACITY_UNIT   = 7;
  READ_CAPACITY_UNIT    = 8;
  ATOMIC_READ_SIZE    = 9;
  ATOMIC_REQUEST_NUMBER = 10;
  ATOMIC_WRITE_SIZE = 11;
  REQUEST_HANDLER_USAGE_MS = 12;
}

message Throttle {
TimedQuota req_num  = 1;
TimedQuota req_size = 2;

TimedQuota write_num  = 3;
TimedQuota write_size = 4;

TimedQuota read_num  = 5;
TimedQuota read_size = 6;

TimedQuota req_capacity_unit   = 7;
TimedQuota write_capacity_unit = 8;
TimedQuota read_capacity_unit  = 9;

TimedQuota atomic_read_size =  10;
TimedQuota atomic_req_num   =  11;
TimedQuota atomic_write_size = 12;

TimedQuota req_handler_usage_ms = 13;
}

message ThrottleRequest {
ThrottleType type = 1;
TimedQuota timed_quota = 2;
}

enum QuotaType {
  THROTTLE = 0;
  SPACE = 1;
}

message Quotas {
bool bypass_globals = 1;
Throttle throttle = 2;
SpaceQuota space = 3;
}

message QuotaUsage {
}

// Defines what action should be taken when the SpaceQuota is violated
enum SpaceViolationPolicy {
  DISABLE = 0; // Disable the table(s)
  NO_WRITES_COMPACTIONS = 1; // No writes, bulk-loads, or compactions
  NO_WRITES = 2; // No writes or bulk-loads
  NO_INSERTS = 3; // No puts or bulk-loads, but deletes are allowed
}

// Defines a limit on the amount of filesystem space used by a table/namespace
message SpaceQuota {
uint64 soft_limit = 1; // The limit of bytes for this quota
SpaceViolationPolicy violation_policy = 2; // The action to take when the quota is violated
bool remove = 3; // When true, remove the quota.
}

// The Request to limit space usage (to allow for schema evolution not tied to SpaceQuota).
message SpaceLimitRequest {
SpaceQuota quota = 1;
}

// Represents the state of a quota on a table. Either the quota is not in violation
// or it is in violation there is a violation policy which should be in effect.
message SpaceQuotaStatus {
SpaceViolationPolicy violation_policy = 1;
bool in_violation = 2;
}

// Message stored in the value of hbase:quota table to denote the status of a table WRT
// the quota applicable to it.
message SpaceQuotaSnapshot {
SpaceQuotaStatus quota_status = 1;
uint64 quota_usage = 2;
uint64 quota_limit = 3;
}

message GetSpaceQuotaRegionSizesRequest {
}

message GetSpaceQuotaRegionSizesResponse {
  message RegionSizes {
TableName table_name = 1;
uint64 size = 2;

  }
  repeated RegionSizes sizes = 1;
}

message GetSpaceQuotaSnapshotsRequest {
}

message GetSpaceQuotaSnapshotsResponse {
  // Cannot use TableName as a map key, do the repeated nested message by hand.
  message TableQuotaSnapshot {
TableName table_name = 1;
SpaceQuotaSnapshot snapshot = 2;
  }
  repeated TableQuotaSnapshot snapshots = 1;
}

message GetQuotaStatesRequest {
}

message GetQuotaStatesResponse {
  message TableQuotaSnapshot {
TableName table_name = 1;
SpaceQuotaSnapshot snapshot = 2;
  }
  message NamespaceQuotaSnapshot {
string namespace = 1;
SpaceQuotaSnapshot snapshot = 2;
  }
  repeated TableQuotaSnapshot table_snapshots = 1;
  repeated NamespaceQuotaSnapshot ns_snapshots = 2;
}
