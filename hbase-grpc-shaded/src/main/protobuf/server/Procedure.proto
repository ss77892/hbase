syntax = "proto3";
package hbase.grpc;

option java_package = "org.apache.hadoop.hbase.shaded.grpc.generated";
option java_outer_classname = "ProcedureProtos";
option java_multiple_files = true;
option java_generic_services = true;
option java_generate_equals_and_hash = true;
option optimize_for = SPEED;

import "google/protobuf/any.proto";
import "server/ErrorHandling.proto";

enum ProcedureState {
  INITIALIZING = 0;         // Procedure in construction, not yet added to the executor
  RUNNABLE = 1;             // Procedure added to the executor, and ready to be executed
  WAITING = 2;              // The procedure is waiting on children to be completed
  WAITING_TIMEOUT = 3;      // The procedure is waiting a timout or an external event
  ROLLEDBACK = 4;           // The procedure failed and was rolledback
  SUCCESS = 5;              // The procedure execution is completed successfully.
  FAILED = 6;               // The procedure execution is failed, may need to rollback
}

/**
 * Procedure metadata, serialized by the ProcedureStore to be able to recover the old state.
 */
message Procedure {
  // internal "static" state
  string class_name = 1;        // full classname to be able to instantiate the procedure
  uint64 parent_id = 2;         // parent if not a root-procedure otherwise not set
  uint64 proc_id = 3;
  uint64 submitted_time = 4;
  string owner = 5;

  // internal "runtime" state
  ProcedureState state = 6;
  repeated uint32 stack_id = 7;          // stack indices in case the procedure was running
  uint64 last_update = 8;
  uint32 timeout = 9;

  // user state/results
  ForeignExceptionMessage exception = 10;
  bytes result = 11;           // opaque (user) result structure
  bytes state_data = 12;       // opaque (user) procedure internal-state - OBSOLATE
  repeated google.protobuf.Any state_message = 15; // opaque (user) procedure internal-state

  // Nonce to prevent same procedure submit by multiple times
  uint64 nonce_group = 13;
  uint64 nonce = 14;

  // whether the procedure has held the lock
  bool locked = 16;

  // whether the procedure need to be bypassed
  bool bypass = 17;

  // whether the procedure has been executed
  // since we do not always maintain the stack_id now, we need a separated flag
  bool executed = 18;
}

/**
 * SequentialProcedure data
 */
message SequentialProcedureData {
  bool executed = 1;
}

/**
 * StateMachineProcedure data
 */
message StateMachineProcedureData {
  repeated uint32 state = 1;
}

/**
 * Procedure WAL header
 */
message ProcedureWALHeader {
  uint32 version = 1;
  uint32 type = 2;
  uint64 log_id = 3;
  uint64 min_proc_id = 4;
}

/**
 * Procedure WAL trailer
 */
message ProcedureWALTrailer {
  uint32 version = 1;
  uint64 tracker_pos = 2;
}

message ProcedureStoreTracker {
  message TrackerNode {
    uint64 start_id = 1;
    repeated uint64 updated = 2;
    repeated uint64 deleted = 3;
  }

  repeated TrackerNode node = 1;
}

message ProcedureWALEntry {
  enum Type {
    PROCEDURE_WAL_EOF     = 0;
    PROCEDURE_WAL_INIT    = 1;
    PROCEDURE_WAL_INSERT  = 2;
    PROCEDURE_WAL_UPDATE  = 3;
    PROCEDURE_WAL_DELETE  = 4;
    PROCEDURE_WAL_COMPACT = 5;
  }

  Type type = 1;
  repeated Procedure procedure = 2;
  uint64 proc_id = 3;
  repeated uint64 child_id = 4;
}
